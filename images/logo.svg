<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52">
  <defs>
    <linearGradient id="hat-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B8C3D"/>
      <stop offset="100%" stop-color="#0A2E14"/>
    </linearGradient>
  </defs>

  <!-- === LEPRECHAUN FACE === -->
  <g transform="translate(26, 26)">
    <!-- Hat brim -->
    <ellipse cx="0" cy="-12" rx="16" ry="3.5" fill="#0A2E14"/>
    <!-- Hat body -->
    <rect x="-10" y="-26" width="20" height="14" rx="3" fill="url(#hat-g)"/>
    <!-- Hat buckle band -->
    <rect x="-10" y="-16" width="20" height="3" fill="#0A2E14"/>
    <!-- Buckle -->
    <rect x="-3" y="-17.5" width="6" height="5" rx="1" fill="#F26522" stroke="#D4551A" stroke-width="0.5"/>
    <rect x="-1.5" y="-16" width="3" height="2" rx="0.5" fill="#0A2E14"/>

    <!-- Face circle -->
    <circle cx="0" cy="-2" r="12" fill="#FDDCB5"/>
    <!-- Rosy cheeks -->
    <circle cx="-7" cy="2" r="3" fill="#F4A68C" opacity="0.5"/>
    <circle cx="7" cy="2" r="3" fill="#F4A68C" opacity="0.5"/>

    <!-- Eyes - happy squint -->
    <ellipse cx="-4.5" cy="-3" rx="2" ry="2.2" fill="white"/>
    <circle cx="-4" cy="-2.8" r="1.2" fill="#2D5016"/>
    <circle cx="-3.6" cy="-3.2" r="0.4" fill="white"/>
    <ellipse cx="4.5" cy="-3" rx="2" ry="2.2" fill="white"/>
    <circle cx="5" cy="-2.8" r="1.2" fill="#2D5016"/>
    <circle cx="5.4" cy="-3.2" r="0.4" fill="white"/>

    <!-- Eyebrows - bushy -->
    <path d="M-7.5 -6 Q-4.5 -8 -2 -6" stroke="#C46A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M2 -6 Q4.5 -8 7.5 -6" stroke="#C46A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Nose - round -->
    <ellipse cx="0" cy="0.5" rx="2" ry="1.8" fill="#E8A882"/>

    <!-- Big smile -->
    <path d="M-5 4 Q0 9 5 4" stroke="#8B4513" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Beard - ginger -->
    <path d="M-11 3 Q-12 14 -6 17 Q0 19 6 17 Q12 14 11 3" fill="#C46A2B" opacity="0.9"/>
    <path d="M-9 5 Q-10 13 -5 15 Q0 17 5 15 Q10 13 9 5" fill="#D4783C"/>
    <!-- Beard texture lines -->
    <path d="M-5 8 Q-4 14 -3 16" stroke="#B8602A" stroke-width="0.5" fill="none"/>
    <path d="M0 7 Q0 13 0 17" stroke="#B8602A" stroke-width="0.5" fill="none"/>
    <path d="M5 8 Q4 14 3 16" stroke="#B8602A" stroke-width="0.5" fill="none"/>

    <!-- Sideburns -->
    <path d="M-11 -2 Q-13 4 -11 7" stroke="#D4783C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M11 -2 Q13 4 11 7" stroke="#D4783C" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Wink star / sparkle near eye -->
    <text x="10" y="-8" font-size="6" fill="#F26522">&#x2728;</text>
  </g>

  <!-- === TEXT === -->
  <text x="52" y="22" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1B8C3D" letter-spacing="3" text-transform="uppercase" opacity="0.7">LUCKY</text>
  <text x="52" y="42" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="900" fill="#0A2E14" letter-spacing="-0.5">Craic</text>
  <text x="130" y="42" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="900" fill="#F26522" letter-spacing="-0.5">Bet</text>

  <!-- Small shamrock accent -->
  <g transform="translate(170, 14) scale(0.4)">
    <ellipse cx="0" cy="-7" rx="5" ry="5.5" fill="#1B8C3D"/>
    <ellipse cx="-6" cy="-1" rx="5" ry="5.5" fill="#1B8C3D" transform="rotate(-25 -6 -1)"/>
    <ellipse cx="6" cy="-1" rx="5" ry="5.5" fill="#1B8C3D" transform="rotate(25 6 -1)"/>
    <path d="M0 3 Q1 8 0 12" stroke="#1B8C3D" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>