<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150">
<defs>
<linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25A94C"/><stop offset="1" stop-color="#0F4A22"/></linearGradient>
