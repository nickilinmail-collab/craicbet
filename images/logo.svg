<text x="190" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-2"><tspan fill="#FFFFFF">Craic</tspan><tspan fill="#F26522">Bet</tspan></text>

