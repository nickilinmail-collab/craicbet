<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B8C3D"/>
      <stop offset="100%" stop-color="#0A2E14"/>
    </linearGradient>
    <linearGradient id="beer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="20%" stop-color="#FFECB3"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>
  </defs>

  <!-- === LEPRECHAUN WITH BEER === -->
  <g transform="translate(24, 24)">
    <!-- HAT -->
    <ellipse cx="0" cy="-8" rx="14" ry="3" fill="#0A2E14"/>
    <rect x="-9" y="-20" width="18" height="12" rx="3" fill="url(#hg)"/>
    <rect x="-9" y="-11" width="18" height="2.5" fill="#0A2E14"/>
    <rect x="-3" y="-12.5" width="6" height="4.5" rx="1" fill="#F26522"/>
    <rect x="-1.2" y="-11" width="2.4" height="2" rx="0.5" fill="#0A2E14"/>

    <!-- FACE -->
    <circle cx="0" cy="1" r="10" fill="#FDDCB5"/>
    <!-- Cheeks -->
    <circle cx="-6" cy="4" r="2.5" fill="#F4A68C" opacity="0.45"/>
    <circle cx="6" cy="4" r="2.5" fill="#F4A68C" opacity="0.45"/>
    <!-- Eyes - winking -->
    <ellipse cx="-3.5" cy="0" rx="1.5" ry="1.7" fill="white"/>
    <circle cx="-3" cy="0.2" r="1" fill="#2D5016"/>
    <circle cx="-2.7" cy="-0.2" r="0.3" fill="white"/>
    <!-- Right eye - wink -->
    <path d="M2.5 0.5 Q4.5 -1 6.5 0.5" stroke="#8B4513" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Eyebrows -->
    <path d="M-6 -2.5 Q-3.5 -4.5 -1.5 -2.5" stroke="#C46A2B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M2.5 -2.5 Q4.5 -4 6.5 -2" stroke="#C46A2B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="0" cy="3" rx="1.8" ry="1.5" fill="#E8A882"/>
    <!-- Big grin -->
    <path d="M-4 6 Q0 10.5 4 6" stroke="#8B4513" stroke-width="1" fill="#fff" stroke-linecap="round"/>
    <!-- Beard -->
    <path d="M-9 5 Q-10 14 -4 16 Q0 17.5 4 16 Q10 14 9 5" fill="#D4783C"/>
    <path d="M-7 7 Q-8 12 -3 14 Q0 15 3 14 Q8 12 7 7" fill="#C46A2B" opacity="0.8"/>
    <!-- Sideburns -->
    <path d="M-9.5 0 Q-11 4 -9.5 7" stroke="#D4783C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M9.5 0 Q11 4 9.5 7" stroke="#D4783C" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- BEER MUG (held to the right) -->
    <g transform="translate(14, 8)">
      <!-- Mug body -->
      <rect x="-5" y="-8" width="10" height="14" rx="2" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.8"/>
      <!-- Beer liquid -->
      <rect x="-4" y="-5" width="8" height="10" rx="1" fill="url(#beer)"/>
      <!-- Foam -->
      <ellipse cx="0" cy="-5" rx="5" ry="2.5" fill="#FFF8E1"/>
      <circle cx="-2.5" cy="-6" r="2" fill="white" opacity="0.7"/>
      <circle cx="1.5" cy="-5.5" r="1.8" fill="white" opacity="0.6"/>
      <circle cx="-0.5" cy="-7" r="1.5" fill="white" opacity="0.5"/>
      <!-- Handle -->
      <path d="M5 -4 Q10 -2 10 3 Q10 7 5 8" stroke="#BDBDBD" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- TEXT -->
  <text x="52" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Craic</tspan><tspan fill="#F26522">Bet</tspan>
  </text>
</svg>