<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="rr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <linearGradient id="pot-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="rr-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="hat-gr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#rr-bg)"/>
  <!-- Sparkle dots -->
  <circle cx="50" cy="30" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="120" cy="50" r="1.5" fill="#FFD700" opacity="0.5"/>
  <circle cx="200" cy="20" r="2" fill="#FFD700" opacity="0.7"/>
  <circle cx="300" cy="35" r="1.5" fill="#FFD700" opacity="0.5"/>
  <circle cx="370" cy="25" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="80" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="330" cy="70" r="1.2" fill="#fff" opacity="0.5"/>
  <!-- Rainbow arc -->
  <path d="M40 180 Q60 20 200 10 Q340 20 360 180" stroke="#FF0000" stroke-width="14" fill="none" opacity="0.7"/>
  <path d="M48 180 Q68 30 200 20 Q332 30 352 180" stroke="#FF9800" stroke-width="12" fill="none" opacity="0.7"/>
  <path d="M56 180 Q76 40 200 30 Q324 40 344 180" stroke="#FFEB3B" stroke-width="10" fill="none" opacity="0.7"/>
  <path d="M62 180 Q82 48 200 38 Q318 48 338 180" stroke="#4CAF50" stroke-width="10" fill="none" opacity="0.7"/>
  <path d="M68 180 Q88 56 200 46 Q312 56 332 180" stroke="#2196F3" stroke-width="10" fill="none" opacity="0.7"/>
  <path d="M74 180 Q94 64 200 54 Q306 64 326 180" stroke="#3F51B5" stroke-width="8" fill="none" opacity="0.7"/>
  <path d="M78 180 Q98 70 200 60 Q302 70 322 180" stroke="#9C27B0" stroke-width="6" fill="none" opacity="0.7"/>
  <!-- Pot of gold (right end of rainbow) -->
  <g transform="translate(320, 130)">
    <!-- Pot body -->
    <ellipse cx="0" cy="35" rx="30" ry="8" fill="#1a1a1a"/>
    <path d="M-28 10 Q-32 35 -25 40 Q0 48 25 40 Q32 35 28 10Z" fill="url(#pot-g)"/>
    <ellipse cx="0" cy="10" rx="28" ry="10" fill="#333"/>
    <!-- Gold rim -->
    <ellipse cx="0" cy="10" rx="28" ry="10" fill="none" stroke="#FFD700" stroke-width="3"/>
    <!-- Coins overflowing -->
    <ellipse cx="-8" cy="4" rx="8" ry="6" fill="url(#rr-coin)"/>
    <ellipse cx="8" cy="2" rx="8" ry="6" fill="url(#rr-coin)"/>
    <ellipse cx="0" cy="-2" rx="7" ry="5" fill="url(#rr-coin)"/>
    <ellipse cx="-14" cy="6" rx="6" ry="5" fill="url(#rr-coin)"/>
    <ellipse cx="14" cy="5" rx="6" ry="5" fill="url(#rr-coin)"/>
    <ellipse cx="-5" cy="-6" rx="6" ry="4" fill="url(#rr-coin)"/>
    <ellipse cx="6" cy="-5" rx="5" ry="4" fill="url(#rr-coin)"/>
  </g>
  <!-- Shamrocks -->
  <g transform="translate(60, 145) scale(0.8)">
    <ellipse cx="0" cy="-7" rx="6" ry="6.5" fill="#4CAF50"/>
    <ellipse cx="-6.5" cy="-1" rx="6" ry="6.5" fill="#4CAF50" transform="rotate(-25 -6.5 -1)"/>
    <ellipse cx="6.5" cy="-1" rx="6" ry="6.5" fill="#4CAF50" transform="rotate(25 6.5 -1)"/>
    <path d="M0 4 Q1.5 10 0 16" stroke="#388E3C" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(160, 160) scale(0.6)">
    <ellipse cx="0" cy="-7" rx="6" ry="6.5" fill="#66BB6A"/>
    <ellipse cx="-6.5" cy="-1" rx="6" ry="6.5" fill="#66BB6A" transform="rotate(-25 -6.5 -1)"/>
    <ellipse cx="6.5" cy="-1" rx="6" ry="6.5" fill="#66BB6A" transform="rotate(25 6.5 -1)"/>
    <path d="M0 4 Q1.5 10 0 16" stroke="#43A047" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(250, 150) scale(0.7)">
    <ellipse cx="0" cy="-7" rx="6" ry="6.5" fill="#4CAF50"/>
    <ellipse cx="-6.5" cy="-1" rx="6" ry="6.5" fill="#4CAF50" transform="rotate(-25 -6.5 -1)"/>
    <ellipse cx="6.5" cy="-1" rx="6" ry="6.5" fill="#4CAF50" transform="rotate(25 6.5 -1)"/>
    <path d="M0 4 Q1.5 10 0 16" stroke="#388E3C" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Leprechaun hat -->
  <g transform="translate(80, 50)">
    <ellipse cx="0" cy="0" rx="22" ry="5" fill="#1B5E20"/>
    <rect x="-14" y="-25" width="28" height="25" rx="4" fill="url(#hat-gr)"/>
    <rect x="-14" y="-8" width="28" height="4" fill="#1B5E20"/>
    <rect x="-5" y="-10" width="10" height="8" rx="1.5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <rect x="-2.5" y="-8" width="5" height="4" rx="1" fill="#1B5E20"/>
  </g>
  <!-- Extra sparkles -->
  <g fill="#FFD700">
    <path d="M150 40 L152 35 L154 40 L159 38 L155 41 L158 45 L153 43 L150 48 L149 43 L144 45 L147 41 L143 38Z" opacity="0.7"/>
    <path d="M280 60 L281 57 L282 60 L285 59 L283 61 L285 63 L282 62 L281 65 L280 62 L277 63 L279 61 L277 59Z" opacity="0.6" transform="scale(1.3) translate(-64,-14)"/>
  </g>
</svg>