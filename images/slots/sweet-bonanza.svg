<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
    <linearGradient id="lollipop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <radialGradient id="candy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E91E63" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <rect width="400" height="200" fill="url(#candy-glow)"/>

  <!-- Sugar particles -->
  <g fill="#FFFFFF" opacity="0.25">
    <circle cx="30" cy="20" r="2"/><circle cx="80" cy="50" r="1.5"/><circle cx="150" cy="15" r="1"/>
    <circle cx="250" cy="30" r="2"/><circle cx="350" cy="55" r="1.5"/><circle cx="380" cy="20" r="1"/>
    <circle cx="60" cy="170" r="1.5"/><circle cx="200" cy="180" r="1"/><circle cx="340" cy="175" r="2"/>
  </g>

  <!-- Large lollipop left -->
  <rect x="68" y="110" width="5" height="90" rx="2" fill="#F5F5DC" stroke="#DDD" stroke-width="0.5"/>
  <circle cx="70" cy="90" r="35" fill="#FF4081" stroke="#C2185B" stroke-width="1.5"/>
  <path d="M45,80 Q55,65 70,60 Q85,65 95,80" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.5"/>
  <path d="M50,95 Q60,82 70,78 Q80,82 90,95" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
  <path d="M55,108 Q62,98 70,95 Q78,98 85,108" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
  <circle cx="60" cy="78" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- Lollipop right -->
  <rect x="318" y="100" width="4" height="100" rx="2" fill="#F5F5DC" stroke="#DDD" stroke-width="0.5"/>
  <circle cx="320" cy="80" r="30" fill="#9C27B0" stroke="#7B1FA2" stroke-width="1.5"/>
  <path d="M298,72 Q305,60 320,56 Q335,60 342,72" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
  <path d="M302,85 Q310,75 320,72 Q330,75 338,85" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
  <circle cx="310" cy="70" r="2.5" fill="#FFFFFF" opacity="0.4"/>

  <!-- Banana shape -->
  <path d="M150,50 Q140,30 160,25 Q180,30 175,50 Q170,65 155,65 Q142,60 150,50Z" fill="#FFE082" stroke="#FFC107" stroke-width="1"/>
  <path d="M155,35 Q162,30 168,35" fill="none" stroke="#FFA000" stroke-width="0.5" opacity="0.5"/>

  <!-- Grapes cluster -->
  <g fill="#7B1FA2" stroke="#4A148C" stroke-width="0.5">
    <circle cx="230" cy="55" r="8"/>
    <circle cx="245" cy="55" r="8"/>
    <circle cx="237" cy="42" r="8"/>
    <circle cx="225" cy="68" r="7"/>
    <circle cx="240" cy="70" r="7"/>
    <circle cx="252" cy="66" r="7"/>
    <circle cx="233" cy="80" r="6"/>
    <circle cx="245" cy="80" r="6"/>
  </g>
  <path d="M237,34 Q240,22 245,20" stroke="#4CAF50" stroke-width="2" fill="none"/>
  <ellipse cx="248" cy="20" rx="6" ry="3" fill="#4CAF50" transform="rotate(-20 248 20)"/>
  <!-- Grape shine -->
  <circle cx="228" cy="52" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="243" cy="52" r="2" fill="#FFFFFF" opacity="0.4"/>

  <!-- Watermelon slice -->
  <path d="M160,130 Q200,90 240,130Z" fill="#E53935" stroke="#C62828" stroke-width="1"/>
  <path d="M165,128 Q200,100 235,128" fill="none" stroke="#4CAF50" stroke-width="5"/>
  <path d="M162,130 Q200,95 238,130" fill="none" stroke="#2E7D32" stroke-width="2"/>
  <!-- Seeds -->
  <ellipse cx="185" cy="120" rx="2" ry="3" fill="#212121" transform="rotate(-15 185 120)"/>
  <ellipse cx="200" cy="115" rx="2" ry="3" fill="#212121"/>
  <ellipse cx="215" cy="120" rx="2" ry="3" fill="#212121" transform="rotate(15 215 120)"/>

  <!-- Candy cane -->
  <g transform="translate(290, 130) rotate(-20)">
    <rect x="-4" y="0" width="8" height="60" rx="4" fill="#FFFFFF"/>
    <rect x="-4" y="0" width="8" height="10" fill="#FF1744"/>
    <rect x="-4" y="20" width="8" height="10" fill="#FF1744"/>
    <rect x="-4" y="40" width="8" height="10" fill="#FF1744"/>
    <path d="M0,0 Q0,-15 15,-15" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M0,-4 Q0,-18 18,-18" fill="none" stroke="#FF1744" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
  </g>

  <!-- Gummy bear -->
  <g transform="translate(130, 150)">
    <ellipse cx="0" cy="8" rx="10" ry="12" fill="#4CAF50"/>
    <circle cx="0" cy="-4" r="8" fill="#4CAF50"/>
    <circle cx="-5" cy="-8" r="4" fill="#4CAF50"/>
    <circle cx="5" cy="-8" r="4" fill="#4CAF50"/>
    <ellipse cx="-8" cy="5" rx="4" ry="3" fill="#4CAF50" transform="rotate(-15)"/>
    <ellipse cx="8" cy="5" rx="4" ry="3" fill="#4CAF50" transform="rotate(15)"/>
    <circle cx="-3" cy="-5" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="3" cy="-5" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="-3" cy="-5" r="0.8" fill="#1B5E20"/>
    <circle cx="3" cy="-5" r="0.8" fill="#1B5E20"/>
    <ellipse cx="0" cy="0" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Sparkles / sugar crystals -->
  <g fill="#FFFFFF" opacity="0.7">
    <polygon points="180,25 182,20 184,25 182,30"/>
    <polygon points="280,40 282,35 284,40 282,45"/>
    <polygon points="350,130 352,125 354,130 352,135"/>
    <polygon points="110,40 112,36 114,40 112,44"/>
    <polygon points="50" cy="140" r="1.5"/>
  </g>
  <g fill="#FFD54F" opacity="0.6">
    <polygon points="200,160 203,153 206,160 203,167"/>
    <polygon points="330,30 332,25 334,30 332,35"/>
  </g>
</svg>