<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="gold-nug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <linearGradient id="gem-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="gem-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#448AFF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="gem-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bm-bg)"/>
  <!-- Mine wall texture -->
  <rect x="0" y="0" width="400" height="60" fill="#2E1A0E" opacity="0.5"/>
  <path d="M0 55 Q50 50 100 58 Q150 52 200 56 Q250 50 300 55 Q350 48 400 54" stroke="#4E342E" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Mine support beams -->
  <rect x="30" y="0" width="10" height="200" fill="#5D4037" opacity="0.4"/>
  <rect x="370" y="0" width="10" height="200" fill="#5D4037" opacity="0.4"/>
  <rect x="25" y="0" width="360" height="8" fill="#5D4037" opacity="0.5"/>
  <!-- Mine tracks -->
  <rect x="100" y="170" width="250" height="3" fill="#78909C" rx="1"/>
  <rect x="100" y="180" width="250" height="3" fill="#78909C" rx="1"/>
  <!-- Track ties -->
  <rect x="120" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="150" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="180" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="210" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="240" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="270" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="300" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <rect x="330" y="168" width="4" height="18" fill="#6D4C41" rx="1"/>
  <!-- Mine cart -->
  <g transform="translate(180, 115)">
    <!-- Cart body -->
    <path d="M-30 30 L-20 0 L60 0 L70 30Z" fill="#607D8B" stroke="#455A64" stroke-width="2"/>
    <path d="M-28 28 L-18 2 L58 2 L68 28Z" fill="#78909C"/>
    <!-- Gems inside cart -->
    <polygon points="0,20 8,10 16,20" fill="url(#gem-red)"/>
    <polygon points="15,18 23,8 31,18" fill="url(#gem-blue)"/>
    <polygon points="30,22 38,12 46,22" fill="url(#gem-green)"/>
    <ellipse cx="10" cy="5" rx="8" ry="6" fill="url(#gold-nug)"/>
    <ellipse cx="35" cy="4" rx="7" ry="5" fill="url(#gold-nug)"/>
    <!-- Wheels -->
    <circle cx="-5" cy="35" r="8" fill="#455A64" stroke="#37474F" stroke-width="2"/>
    <circle cx="-5" cy="35" r="3" fill="#37474F"/>
    <circle cx="45" cy="35" r="8" fill="#455A64" stroke="#37474F" stroke-width="2"/>
    <circle cx="45" cy="35" r="3" fill="#37474F"/>
  </g>
  <!-- Pickaxe -->
  <g transform="translate(60, 70) rotate(-30)">
    <rect x="-2" y="0" width="4" height="60" rx="2" fill="#8D6E63"/>
    <path d="M-20 0 Q-10 -15 0 -5 Q10 -15 20 0 Q10 5 0 2 Q-10 5 -20 0Z" fill="#90A4AE" stroke="#607D8B" stroke-width="1"/>
  </g>
  <!-- TNT dynamite -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="12" height="40" rx="6" fill="#D32F2F"/>
    <rect x="15" y="5" width="12" height="38" rx="6" fill="#D32F2F"/>
    <rect x="7" y="-3" width="12" height="42" rx="6" fill="#E53935"/>
    <!-- Fuse -->
    <path d="M13 -3 Q15 -15 20 -20 Q25 -22 28 -18" stroke="#5D4037" stroke-width="1.5" fill="none"/>
    <!-- Spark -->
    <circle cx="28" cy="-18" r="4" fill="#FFD700" opacity="0.8"/>
    <circle cx="28" cy="-18" r="2" fill="#FFF"/>
  </g>
  <!-- Lantern -->
  <g transform="translate(55, 20)">
    <circle cx="0" cy="0" r="25" fill="url(#lantern-glow)"/>
    <rect x="-5" y="-8" width="10" height="16" rx="2" fill="#FFD700" opacity="0.7"/>
    <rect x="-6" y="-10" width="12" height="3" rx="1" fill="#8D6E63"/>
    <rect x="-6" y="6" width="12" height="3" rx="1" fill="#8D6E63"/>
    <path d="M-2 -13 Q0 -18 2 -13" stroke="#8D6E63" stroke-width="1.5" fill="none"/>
    <ellipse cx="0" cy="-2" rx="2" ry="4" fill="#FFF" opacity="0.5"/>
  </g>
  <!-- Scattered gold nuggets -->
  <ellipse cx="140" cy="165" rx="6" ry="5" fill="url(#gold-nug)"/>
  <ellipse cx="280" cy="162" rx="5" ry="4" fill="url(#gold-nug)"/>
  <ellipse cx="350" cy="165" rx="7" ry="5" fill="url(#gold-nug)"/>
</svg>