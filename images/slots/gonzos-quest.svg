<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="gq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="40%" stop-color="#2E4A1E"/>
      <stop offset="100%" stop-color="#8D6E23"/>
    </linearGradient>
    <linearGradient id="sun-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="stone-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D8D8D"/>
      <stop offset="100%" stop-color="#5D5D5D"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#gq-bg)"/>
  <!-- Jungle canopy -->
  <ellipse cx="50" cy="20" rx="60" ry="40" fill="#2E7D32" opacity="0.6"/>
  <ellipse cx="150" cy="10" rx="70" ry="35" fill="#388E3C" opacity="0.5"/>
  <ellipse cx="350" cy="15" rx="65" ry="38" fill="#2E7D32" opacity="0.6"/>
  <ellipse cx="250" cy="5" rx="50" ry="30" fill="#388E3C" opacity="0.4"/>
  <!-- Tropical leaves -->
  <path d="M0 80 Q20 40 40 60 Q30 50 10 70Z" fill="#4CAF50" opacity="0.7"/>
  <path d="M380 70 Q360 30 340 50 Q350 40 370 60Z" fill="#4CAF50" opacity="0.7"/>
  <path d="M20 100 Q40 60 55 85 Q45 75 25 90Z" fill="#43A047" opacity="0.6"/>
  <path d="M370 90 Q350 55 335 78 Q345 68 365 82Z" fill="#43A047" opacity="0.6"/>
  <!-- Vines -->
  <path d="M80 0 Q85 30 75 60 Q70 80 80 100" stroke="#388E3C" stroke-width="3" fill="none"/>
  <path d="M78 40 Q65 35 60 45" stroke="#4CAF50" stroke-width="2" fill="none"/>
  <path d="M76 65 Q63 60 58 70" stroke="#4CAF50" stroke-width="2" fill="none"/>
  <path d="M320 0 Q315 25 325 50 Q330 70 320 90" stroke="#388E3C" stroke-width="3" fill="none"/>
  <path d="M322 35 Q335 30 340 40" stroke="#4CAF50" stroke-width="2" fill="none"/>
  <!-- Temple steps -->
  <g transform="translate(120, 100)">
    <rect x="0" y="60" width="160" height="20" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <rect x="10" y="42" width="140" height="20" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <rect x="20" y="24" width="120" height="20" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <rect x="30" y="6" width="100" height="20" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <rect x="40" y="-12" width="80" height="20" fill="#8D6E63" stroke="#6D4C41" stroke-width="1"/>
    <!-- Moss/weathering -->
    <rect x="5" y="60" width="15" height="3" rx="1" fill="#4CAF50" opacity="0.4"/>
    <rect x="130" y="42" width="12" height="3" rx="1" fill="#4CAF50" opacity="0.3"/>
    <rect x="25" y="24" width="10" height="3" rx="1" fill="#4CAF50" opacity="0.4"/>
  </g>
  <!-- Aztec stone mask -->
  <g transform="translate(200, 65)">
    <!-- Sun glow behind -->
    <circle cx="0" cy="0" r="45" fill="url(#sun-glow)"/>
    <!-- Sun medallion outer ring -->
    <circle cx="0" cy="0" r="32" fill="url(#sun-med)" stroke="#B8860B" stroke-width="2"/>
    <!-- Sun rays -->
    <g fill="#FFD700" opacity="0.8">
      <polygon points="0,-38 -4,-32 4,-32"/>
      <polygon points="0,38 -4,32 4,32"/>
      <polygon points="-38,0 -32,-4 -32,4"/>
      <polygon points="38,0 32,-4 32,4"/>
      <polygon points="-27,-27 -20,-24 -24,-20"/>
      <polygon points="27,-27 20,-24 24,-20"/>
      <polygon points="-27,27 -20,24 -24,20"/>
      <polygon points="27,27 20,24 24,20"/>
    </g>
    <!-- Inner face circle -->
    <circle cx="0" cy="0" r="24" fill="url(#stone-g)" stroke="#5D4037" stroke-width="2"/>
    <!-- Face features -->
    <!-- Eyes -->
    <rect x="-14" y="-10" width="10" height="6" rx="1" fill="#3E2723"/>
    <rect x="4" y="-10" width="10" height="6" rx="1" fill="#3E2723"/>
    <rect x="-12" y="-9" width="3" height="4" fill="#FFD700"/>
    <rect x="9" y="-9" width="3" height="4" fill="#FFD700"/>
    <!-- Nose -->
    <path d="M-4 -2 L0 4 L4 -2" stroke="#3E2723" stroke-width="2" fill="none"/>
    <!-- Mouth -->
    <rect x="-10" y="8" width="20" height="6" rx="1" fill="#3E2723"/>
    <rect x="-6" y="9" width="3" height="4" fill="#5D4037"/>
    <rect x="-1" y="9" width="3" height="4" fill="#5D4037"/>
    <rect x="4" y="9" width="3" height="4" fill="#5D4037"/>
    <!-- Decorative lines -->
    <path d="M-18 -16 Q-20 -20 -16 -18" stroke="#5D4037" stroke-width="1.5" fill="none"/>
    <path d="M18 -16 Q20 -20 16 -18" stroke="#5D4037" stroke-width="1.5" fill="none"/>
    <!-- Forehead symbol -->
    <path d="M-5 -16 L0 -20 L5 -16" stroke="#B8860B" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Small flying birds -->
  <path d="M290 30 Q293 25 296 30" stroke="#1B5E20" stroke-width="1.5" fill="none"/>
  <path d="M310 22 Q313 17 316 22" stroke="#1B5E20" stroke-width="1.5" fill="none"/>
</svg>