<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B8C3D"/>
      <stop offset="100%" stop-color="#0A2E14"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10" fill="#0A2E14"/>
  <g transform="translate(24, 26)">
    <!-- Hat brim -->
    <ellipse cx="0" cy="-12" rx="14" ry="3" fill="#145224"/>
    <!-- Hat -->
    <rect x="-9" y="-24" width="18" height="12" rx="2.5" fill="url(#hg)"/>
    <rect x="-9" y="-15" width="18" height="2.5" fill="#145224"/>
    <rect x="-2.5" y="-16" width="5" height="4" rx="1" fill="#F26522"/>
    <rect x="-1" y="-14.5" width="2" height="1.5" rx="0.5" fill="#0A2E14"/>
    <!-- Face -->
    <circle cx="0" cy="-2" r="11" fill="#FDDCB5"/>
    <circle cx="-6" cy="1" r="2.5" fill="#F4A68C" opacity="0.4"/>
    <circle cx="6" cy="1" r="2.5" fill="#F4A68C" opacity="0.4"/>
    <!-- Eyes -->
    <circle cx="-4" cy="-3" r="1.5" fill="white"/>
    <circle cx="-3.5" cy="-2.8" r="0.9" fill="#2D5016"/>
    <circle cx="4" cy="-3" r="1.5" fill="white"/>
    <circle cx="4.5" cy="-2.8" r="0.9" fill="#2D5016"/>
    <!-- Nose -->
    <ellipse cx="0" cy="0" rx="1.8" ry="1.5" fill="#E8A882"/>
    <!-- Smile -->
    <path d="M-4 3 Q0 7.5 4 3" stroke="#8B4513" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Beard -->
    <path d="M-10 2 Q-11 12 -5 15 Q0 17 5 15 Q11 12 10 2" fill="#D4783C"/>
    <path d="M-8 4 Q-9 11 -4 13 Q0 15 4 13 Q9 11 8 4" fill="#C46A2B" opacity="0.7"/>
    <!-- Sideburns -->
    <path d="M-10 -2 Q-12 3 -10 6" stroke="#D4783C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M10 -2 Q12 3 10 6" stroke="#D4783C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
